name: Vera Finalize
on: [push]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('historial:historial\n\n    });','historial:historial.slice(0,-1)\n\n    });',1)
          old='''    if(data.error){\n\n      agregarMensaje(\n        "assistant",\n        data.mensaje ||\n        data.error\n      );\n\n      return;\n\n    }'''
          new='''    if(data.error){\n\n      const detalle = data.razon ? "\\n\\n" + data.razon : "";\n      agregarMensaje("assistant",(data.mensaje || data.error) + detalle);\n      return;\n\n    }'''
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: stabilize Vera chat UI"
          git push
