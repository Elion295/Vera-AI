name: Vera Admin Upgrade
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend and admin
        run: |
          cat > /tmp/upgrade.py <<'PY'
          from pathlib import Path

          code = Path('code.gs').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')

          module = r'''/* ==================================================
             VERA USAGE MODULE
             Tokens, cuotas y métricas de consumo
          ================================================== */

          const PROP_TOKEN_USO = "VERA_TOKEN_USO";
          const PROP_CONSUMO_IA = "VERA_CONSUMO_IA";
          const LIMITES_TOKENS_DIARIOS = {
            invitado: 10000,
            estandar: 50000,
            premium: 500000,
            moderador: Infinity,
            admin: Infinity
          };

          function estimarTokensVera(texto) {
            return Math.max(1, Math.ceil(String(texto || "").length / 4));
          }

          function claveDiaVera() {
            const zona = Session.getScriptTimeZone() || "America/Mexico_City";
            return Utilities.formatDate(new Date(), zona, "yyyy-MM-dd");
          }

          function obtenerUsoTokensVera(usuario) {
            const props = PropertiesService.getScriptProperties();
            const raw = props.getProperty(PROP_TOKEN_USO);
            let data = {};
            try { data = raw ? JSON.parse(raw) : {}; } catch (e) { data = {}; }
            const key = claveDiaVera() + "|" + String(usuario || "");
            return Number(data[key] || 0);
          }

          function sumarUsoTokensVera(usuario, cantidad) {
            const props = PropertiesService.getScriptProperties();
            const raw = props.getProperty(PROP_TOKEN_USO);
            let data = {};
            try { data = raw ? JSON.parse(raw) : {}; } catch (e) { data = {}; }
            const key = claveDiaVera() + "|" + String(usuario || "");
            data[key] = Number(data[key] || 0) + Math.max(0, Number(cantidad) || 0);
            const keys = Object.keys(data);
            if (keys.length > 5000) {
              keys.slice(0, keys.length - 5000).forEach(k => delete data[k]);
            }
            props.setProperty(PROP_TOKEN_USO, JSON.stringify(data));
            return data[key];
          }

          function limiteTokensVera(rol) {
            return Object.prototype.hasOwnProperty.call(LIMITES_TOKENS_DIARIOS, rol)
              ? LIMITES_TOKENS_DIARIOS[rol]
              : LIMITES_TOKENS_DIARIOS.estandar;
          }

          function leerConsumoVera() {
            const raw = PropertiesService.getScriptProperties().getProperty(PROP_CONSUMO_IA);
            if (!raw) return { total: { peticiones: 0, inputTokens: 0, outputTokens: 0, tokens: 0, errores: 0, latenciaMs: 0 }, usuarios: {} };
            try { return JSON.parse(raw); } catch (e) {
              return { total: { peticiones: 0, inputTokens: 0, outputTokens: 0, tokens: 0, errores: 0, latenciaMs: 0 }, usuarios: {} };
            }
          }

          function guardarConsumoVera(data) {
            PropertiesService.getScriptProperties().setProperty(PROP_CONSUMO_IA, JSON.stringify(data));
          }

          function registrarConsumoVera(usuario, inputTokens, outputTokens, latenciaMs, error) {
            const data = leerConsumoVera();
            const total = data.total;
            const nombre = String(usuario || "desconocido");
            if (!data.usuarios[nombre]) data.usuarios[nombre] = { peticiones: 0, inputTokens: 0, outputTokens: 0, tokens: 0, errores: 0, latenciaMs: 0, ultimaActividad: null };
            const u = data.usuarios[nombre];
            const inT = Math.max(0, Number(inputTokens) || 0);
            const outT = Math.max(0, Number(outputTokens) || 0);
            const lat = Math.max(0, Number(latenciaMs) || 0);
            u.peticiones += 1;
            u.inputTokens += inT;
            u.outputTokens += outT;
            u.tokens += inT + outT;
            u.errores += error ? 1 : 0;
            u.latenciaMs += lat;
            u.ultimaActividad = new Date().toISOString();
            total.peticiones += 1;
            total.inputTokens += inT;
            total.outputTokens += outT;
            total.tokens += inT + outT;
            total.errores += error ? 1 : 0;
            total.latenciaMs += lat;
            guardarConsumoVera(data);
          }

          function obtenerConsumoVeraAdmin(token) {
            if (!validarAdmin(token)) return respuestaError("FORBIDDEN", "No tienes permiso para ver el consumo.", "Se requiere una sesión administrativa.");
            const data = leerConsumoVera();
            Object.keys(data.usuarios).forEach(nombre => {
              const u = data.usuarios[nombre];
              u.latenciaPromedioMs = u.peticiones ? Math.round(u.latenciaMs / u.peticiones) : 0;
            });
            data.total.latenciaPromedioMs = data.total.peticiones ? Math.round(data.total.latenciaMs / data.total.peticiones) : 0;
            return respuesta({ ok: true, consumo: data });
          }

          function guardarPalabrasProhibidasAdmin(token, palabras) {
            if (!validarModerador(token)) return respuestaError("FORBIDDEN", "No tienes permiso.", "Se requiere una sesión de moderador o administrador.");
            const seguridad = obtenerSeguridad();
            seguridad.palabrasProhibidas = Array.isArray(palabras) ? palabras.map(x => String(x).trim()).filter(Boolean).slice(0, 500) : [];
            PropertiesService.getScriptProperties().setProperty(PROP_SEGURIDAD, JSON.stringify(seguridad));
            registrarAuditoria("Elion", "GUARDAR_PALABRAS", "seguridad", "Se actualizó la lista de palabras bloqueadas.");
            return respuesta({ ok: true });
          }
          '''

          if 'const PROP_TOKEN_USO = "VERA_TOKEN_USO"' not in code:
              insert_at = '/* ==================================================\n   USUARIOS\n================================================== */'
              code = code.replace(insert_at, module + '\n\n' + insert_at, 1)

          do_post_old = '''      case "health":\n        return obtenerHealth(\n          body.token\n        );'''
          do_post_new = '''      case "health":\n        return obtenerHealth(\n          body.token\n        );\n\n\n      case "consumo":\n        return obtenerConsumoVeraAdmin(\n          body.token\n        );\n\n\n      case "guardarPalabrasProhibidas":\n        return guardarPalabrasProhibidasAdmin(\n          body.token,\n          body.palabras || []\n        );'''
          if 'case "consumo":' not in code and do_post_old in code:
              code = code.replace(do_post_old, do_post_new, 1)

          # Token quota gate before the expensive IA call.
          gate_old = '''  registrarMensaje(\n    sesion.usuario,\n    sesion.guestId\n  );'''
          gate_new = '''  registrarMensaje(\n    sesion.usuario,\n    sesion.guestId\n  );\n\n\n  const limiteTokensDia = limiteTokensVera(sesion.rol);\n  const tokensDiaUsados = obtenerUsoTokensVera(sesion.usuario);\n  const tokensEntradaEstimados = estimarTokensVera(mensaje);\n\n  if (\n    limiteTokensDia !== Infinity &&\n    tokensDiaUsados + tokensEntradaEstimados > limiteTokensDia\n  ) {\n    return respuesta({\n      error: "TOKEN_LIMIT",\n      mensaje: "Has alcanzado tu cuota diaria de tokens.",\n      razon: "Tu cuenta permite " + limiteTokensDia + " tokens estimados por día y ya utilizaste " + tokensDiaUsados + ".",\n      tokensUsados: tokensDiaUsados,\n      tokensLimite: limiteTokensDia,\n      tokensRestantes: Math.max(0, limiteTokensDia - tokensDiaUsados)\n    });\n  }'''
          if 'cuota diaria de tokens' not in code and gate_old in code:
              code = code.replace(gate_old, gate_new, 1)

          # Count estimated token usage after a successful response.
          success_old = '''    registrarLog(\n      sesion.usuario,\n      "CHAT",\n      "Respuesta generada en " +\n      latencia +\n      " ms."\n    );'''
          success_new = '''    const tokensEntrada = estimarTokensVera(JSON.stringify(contents));\n    const tokensSalida = estimarTokensVera(respuestaIA);\n    const tokensTotales = tokensEntrada + tokensSalida;\n    const tokensDiaActual = sumarUsoTokensVera(sesion.usuario, tokensTotales);\n    registrarConsumoVera(sesion.usuario, tokensEntrada, tokensSalida, latencia, false);\n\n    registrarLog(\n      sesion.usuario,\n      "CHAT",\n      "Respuesta generada en " +\n      latencia +\n      " ms. Tokens estimados: " +\n      tokensTotales\n    );'''
          if 'const tokensEntrada = estimarTokensVera' not in code and success_old in code:
              code = code.replace(success_old, success_new, 1)

          return_old = '''      mensajes:\n        obtenerMensajesHoy(\n          sesion.usuario,\n          sesion.guestId\n        ),'''
          return_new = '''      mensajes:\n        obtenerMensajesHoy(\n          sesion.usuario,\n          sesion.guestId\n        ),\n\n      tokensUsados: tokensDiaActual,\n\n      tokensLimite:\n        limiteTokensDia === Infinity\n          ? null\n          : limiteTokensDia,\n\n      tokensRestantes:\n        limiteTokensDia === Infinity\n          ? null\n          : Math.max(0, limiteTokensDia - tokensDiaActual),'''
          if 'tokensRestantes:' not in code and return_old in code:
              code = code.replace(return_old, return_new, 1)

          # Add consumption tab.
          tab_old = '''      <button\n        class="adminTab"\n        onclick="mostrarSeccion('health',this)"\n      >\n        💚 Salud\n      </button>'''
          tab_new = tab_old + '''\n\n      <button\n        class="adminTab"\n        onclick="mostrarSeccion('consumo',this)"\n      >\n        🧮 Consumo\n      </button>'''
          if "mostrarSeccion('consumo',this)" not in html and tab_old in html:
              html = html.replace(tab_old, tab_new, 1)

          # Add token quota to user table if supported.
          dash_old = '''      <div class="statCard">\n        <div class="statNumber">${s.invitados ?? 0}</div>\n        <div class="statLabel">Invitados</div>\n      </div>'''
          dash_new = dash_old + '''\n\n      <div class="statCard">\n        <div class="statNumber">${s.mensajesHoy ?? 0}</div>\n        <div class="statLabel">Mensajes hoy</div>\n      </div>'''
          if 'Mensajes hoy' not in html and dash_old in html:
              html = html.replace(dash_old, dash_new, 1)

          # Add consumption section before CONFIG.
          section_marker = '''      <!-- CONFIG -->'''
          section = '''      <!-- CONSUMO -->\n\n      <section id="section-consumo" class="adminSection">\n\n        <h2 class="sectionTitle">Consumo de Vera</h2>\n\n        <p class="sectionDescription">Tokens estimados, peticiones, errores y latencia del servicio. Las cifras de tokens son aproximadas.</p>\n\n        <div id="consumptionGrid" class="statsGrid">Cargando...</div>\n\n        <div class="adminCard">\n          <div class="cardHeader">\n            <h3>Por usuario</h3>\n            <button class="smallBtn" onclick="cargarConsumo()">↻ Actualizar</button>\n          </div>\n          <div id="consumptionTable">Cargando...</div>\n        </div>\n\n      </section>\n\n'''
          if 'id="section-consumo"' not in html and section_marker in html:
              html = html.replace(section_marker, section + section_marker, 1)

          js_marker = '''/* ==================================================\n   UTILIDADES\n================================================== */'''
          js = '''/* ==================================================\n   CONSUMO\n================================================== */\n\nasync function cargarConsumo(){\n  const grid=document.getElementById("consumptionGrid");\n  const table=document.getElementById("consumptionTable");\n  try{\n    const data=await api({accion:"consumo",token:token});\n    if(data.error){\n      grid.innerHTML=`<div class="empty">${escapeHTML(data.mensaje || data.error)}<br>${escapeHTML(data.razon || "")}</div>`;\n      return;\n    }\n    const c=data.consumo||{};\n    const t=c.total||{};\n    grid.innerHTML=`\n      <div class="statCard"><div class="statNumber">${t.peticiones||0}</div><div class="statLabel">Peticiones</div></div>\n      <div class="statCard"><div class="statNumber">${t.tokens||0}</div><div class="statLabel">Tokens estimados</div></div>\n      <div class="statCard"><div class="statNumber">${t.errores||0}</div><div class="statLabel">Errores IA</div></div>\n      <div class="statCard"><div class="statNumber">${t.latenciaPromedioMs||0} ms</div><div class="statLabel">Latencia promedio</div></div>`;\n    const rows=Object.entries(c.usuarios||{}).sort((a,b)=>(b[1].tokens||0)-(a[1].tokens||0));\n    if(!rows.length){table.innerHTML=`<div class="empty">No hay consumo registrado todavía.</div>`;return;}\n    table.innerHTML=`<div class="tableWrap"><table><thead><tr><th>Usuario</th><th>Peticiones</th><th>Entrada</th><th>Salida</th><th>Total</th><th>Latencia</th><th>Errores</th></tr></thead><tbody>`+rows.map(([n,u])=>`<tr><td>${escapeHTML(n)}</td><td>${u.peticiones||0}</td><td>${u.inputTokens||0}</td><td>${u.outputTokens||0}</td><td>${u.tokens||0}</td><td>${u.latenciaPromedioMs||0} ms</td><td>${u.errores||0}</td></tr>`).join("")+`</tbody></table></div>`;\n  }catch(e){console.error(e);grid.innerHTML=`<div class="empty">No se pudo cargar el consumo.</div>`;}\n}\n\n'''
          if 'async function cargarConsumo()' not in html and js_marker in html:
              html = html.replace(js_marker, js + js_marker, 1)

          loader_old = '  if(nombre==="health") cargarHealth();'
          loader_new = '  if(nombre==="health") cargarHealth();\n  if(nombre==="consumo") cargarConsumo();'
          if 'if(nombre==="consumo") cargarConsumo();' not in html and loader_old in html:
              html = html.replace(loader_old, loader_new, 1)

          all_old = '  cargarHealth();\n  cargarConfiguracion();'
          all_new = '  cargarHealth();\n  cargarConsumo();\n  cargarConfiguracion();'
          if '  cargarConsumo();\n' not in html and all_old in html:
              html = html.replace(all_old, all_new, 1)

          Path('code.gs').write_text(code, encoding='utf-8')
          Path('index.html').write_text(html, encoding='utf-8')
          PY
          python3 /tmp/upgrade.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code.gs index.html
          git diff --cached --quiet || git commit -m "feat: add Vera quotas tokens and consumption dashboard"
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/vera-admin-upgrade.yml
          git commit -m "chore: remove one-shot Vera admin workflow"
          git push
