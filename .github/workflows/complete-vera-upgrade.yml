name: Complete Vera Upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade Vera
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          code = Path('code.gs').read_text(encoding='utf-8')

          def once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1), True
              print(f'SKIP {label}: pattern not found')
              return text, False

          changed_index = False
          changed_code = False

          # --- Chat reliability: client sends only previous turns.
          index, ok = once(
              index,
              'historial:historial\n\n    });',
              'historial:historial.slice(0,-1)\n\n    });',
              'chat-history-client'
          )
          changed_index |= ok

          # Show backend reason/details for every structured error.
          old = '''    if(data.error){\n\n      agregarMensaje(\n        "assistant",\n        data.mensaje ||\n        data.error\n      );\n\n      return;\n\n    }'''
          new = '''    if(data.error){\n\n      const detalle =\n        data.razon\n          ? "\\n\\n" + data.razon\n          : "";\n\n      agregarMensaje(\n        "assistant",\n        (data.mensaje || data.error) + detalle\n      );\n\n      return;\n\n    }'''
          index, ok = once(index, old, new, 'chat-error-details')
          changed_index |= ok

          # Better connection errors.
          old = '''  }catch(error){\n\n    ocultarTyping();\n\n    agregarMensaje(\n      "assistant",\n      "No pude conectar con Vera."\n    );\n\n  }finally{'''
          new = '''  }catch(error){\n\n    ocultarTyping();\n\n    console.error("Error al enviar mensaje:", error);\n\n    agregarMensaje(\n      "assistant",\n      "No pude conectar con Vera.\\n\\n" +\n      (error && error.message ? error.message : "Error desconocido.")\n    );\n\n  }finally{'''
          index, ok = once(index, old, new, 'chat-network-error')
          changed_index |= ok

          # --- Backend: defensive history de-duplication.
          old = '''  const historial =\n    Array.isArray(\n      body.historial\n    )\n      ? body.historial.slice(-30)\n      : [];'''
          new = '''  let historial =\n    Array.isArray(\n      body.historial\n    )\n      ? body.historial.slice(-30)\n      : [];\n\n\n  /* El cliente puede enviar el mensaje actual en el historial.\n     Nunca debemos duplicarlo en el payload de Gemini. */\n  const ultimo =\n    historial.length\n      ? historial[historial.length - 1]\n      : null;\n\n  if (\n    ultimo &&\n    ultimo.rol === "user" &&\n    String(ultimo.texto || "").trim() === mensaje\n  ) {\n    historial = historial.slice(0, -1);\n  }'''
          code, ok = once(code, old, new, 'chat-history-backend')
          changed_code |= ok

          # --- Backend action aliases to match frontend calls.
          replacements = [
              ('      case "avisos":\n', '      case "listarAvisos":\n        return obtenerAvisos(\n          body.token,\n          false\n        );\n\n\n      case "avisos":\n'),
              ('      case "analiticas":\n', '      case "analiticas":\n'),
              ('      case "guardarSeguridad":\n', '      case "guardarPalabrasProhibidas":\n        return guardarPalabrasProhibidasAdmin(\n          body.token,\n          body.palabras || []\n        );\n\n\n      case "guardarSeguridad":\n'),
              ('      case "obtenerMantenimiento":\n', '      case "obtenerMantenimiento":\n'),
              ('      case "resolverReporte":\n        return resolverReporte(\n          body.token,\n          body.id,\n          body.accionReporte\n        );', '      case "resolverReporte":\n        return resolverReporte(\n          body.token,\n          body.id,\n          body.accionReporte || body.estado\n        );')
          ]
          for old, new in replacements:
              if old in code and new not in code:
                  code = code.replace(old, new, 1)
                  changed_code = True

          # Frontend uses security field names different from the backend defaults.
          old = '''    document.getElementById("safeMinor").checked =\n      !!s.minorProtection;\n\n    document.getElementById("safeSexual").checked =\n      !!s.explicitSexual;\n\n    document.getElementById("safePorn").checked =\n      !!s.pornography;\n\n    document.getElementById("safeSelfHarm").checked =\n      !!s.selfHarm;\n\n    document.getElementById("safeViolence").checked =\n      !!s.graphicViolence;\n\n    document.getElementById("safeInjection").checked =\n      !!s.promptInjection;\n\n    document.getElementById("safeWords").value =\n      (s.prohibitedWords || []).join("\\n");'''
          new = '''    document.getElementById("safeMinor").checked =\n      !!(s.minorProtection ?? s.proteccionMenores);\n\n    document.getElementById("safeSexual").checked =\n      !!(s.explicitSexual ?? s.contenidoSexualExplicito);\n\n    document.getElementById("safePorn").checked =\n      !!(s.pornography ?? s.pornografia);\n\n    document.getElementById("safeSelfHarm").checked =\n      !!(s.selfHarm ?? s.autolesiones);\n\n    document.getElementById("safeViolence").checked =\n      !!(s.graphicViolence ?? s.violenciaGrafica);\n\n    document.getElementById("safeInjection").checked =\n      !!(s.promptInjection ?? s.deteccionEvasion);\n\n    document.getElementById("safeWords").value =\n      (s.prohibitedWords || s.palabrasProhibidas || []).join("\\n");'''
          index, ok = once(index, old, new, 'security-field-compat')
          changed_index |= ok

          # Preserve both accepted field shapes when saving security settings.
          old = '''  const seguridad = {\n\n    minorProtection:\n      document.getElementById("safeMinor").checked,\n\n    explicitSexual:\n      document.getElementById("safeSexual").checked,\n\n    pornography:\n      document.getElementById("safePorn").checked,\n\n    selfHarm:\n      document.getElementById("safeSelfHarm").checked,\n\n    graphicViolence:\n      document.getElementById("safeViolence").checked,\n\n    promptInjection:\n      document.getElementById("safeInjection").checked\n\n  };'''
          new = '''  const seguridad = {\n\n    minorProtection:\n      document.getElementById("safeMinor").checked,\n\n    explicitSexual:\n      document.getElementById("safeSexual").checked,\n\n    pornography:\n      document.getElementById("safePorn").checked,\n\n    selfHarm:\n      document.getElementById("safeSelfHarm").checked,\n\n    graphicViolence:\n      document.getElementById("safeViolence").checked,\n\n    promptInjection:\n      document.getElementById("safeInjection").checked,\n\n    proteccionMenores:\n      document.getElementById("safeMinor").checked,\n\n    contenidoSexualExplicito:\n      document.getElementById("safeSexual").checked,\n\n    pornografia:\n      document.getElementById("safePorn").checked,\n\n    autolesiones:\n      document.getElementById("safeSelfHarm").checked,\n\n    violenciaGrafica:\n      document.getElementById("safeViolence").checked,\n\n    deteccionEvasion:\n      document.getElementById("safeInjection").checked\n\n  };'''
          index, ok = once(index, old, new, 'security-save-compat')
          changed_index |= ok

          # --- Add token/usage management endpoint to backend.
          marker = '/* ==================================================\\n   USUARIOS\\n================================================== */'
          usage_code = r'''/* ==================================================
   CONSUMO, TOKENS Y COSTOS ESTIMADOS
================================================== */

const PROP_CONSUMO = "VERA_CONSUMO";

function consumoDefault() {
  return {
    usuarios: {},
    total: {
      peticiones: 0,
      inputTokens: 0,
      outputTokens: 0,
      tokens: 0,
      errores: 0,
      latenciaMs: 0,
      costoEstimado: 0
    }
  };
}

function obtenerConsumo() {
  const raw = PropertiesService.getScriptProperties().getProperty(PROP_CONSUMO);
  if (!raw) return consumoDefault();
  try {
    const data = JSON.parse(raw);
    return Object.assign(consumoDefault(), data);
  } catch (e) {
    return consumoDefault();
  }
}

function guardarConsumo(data) {
  PropertiesService.getScriptProperties().setProperty(PROP_CONSUMO, JSON.stringify(data));
}

function estimarTokens(texto) {
  return Math.max(1, Math.ceil(String(texto || "").length / 4));
}

function registrarConsumoIA(usuario, inputTokens, outputTokens, latenciaMs, error) {
  const data = obtenerConsumo();
  const nombre = String(usuario || "desconocido");
  if (!data.usuarios[nombre]) {
    data.usuarios[nombre] = {
      peticiones: 0,
      inputTokens: 0,
      outputTokens: 0,
      tokens: 0,
      errores: 0,
      latenciaMs: 0,
      ultimaActividad: null,
      costoEstimado: 0
    };
  }
  const u = data.usuarios[nombre];
  const inT = Math.max(0, Number(inputTokens) || 0);
  const outT = Math.max(0, Number(outputTokens) || 0);
  const lat = Math.max(0, Number(latenciaMs) || 0);
  u.peticiones++;
  u.inputTokens += inT;
  u.outputTokens += outT;
  u.tokens += inT + outT;
  u.errores += error ? 1 : 0;
  u.latenciaMs += lat;
  u.ultimaActividad = new Date().toISOString();
  data.total.peticiones++;
  data.total.inputTokens += inT;
  data.total.outputTokens += outT;
  data.total.tokens += inT + outT;
  data.total.errores += error ? 1 : 0;
  data.total.latenciaMs += lat;
  guardarConsumo(data);
}

function obtenerConsumoAdmin(token) {
  if (!validarAdmin(token)) {
    return respuestaError("FORBIDDEN", "No tienes permiso para ver el consumo.", "Se requiere una sesión administrativa.");
  }
  const data = obtenerConsumo();
  const total = data.total || consumoDefault().total;
  const costoInput = Number(PropertiesService.getScriptProperties().getProperty("VERA_COSTO_INPUT_POR_MILLON")) || 0;
  const costoOutput = Number(PropertiesService.getScriptProperties().getProperty("VERA_COSTO_OUTPUT_POR_MILLON")) || 0;
  total.costoEstimado = (total.inputTokens / 1000000) * costoInput + (total.outputTokens / 1000000) * costoOutput;
  Object.keys(data.usuarios).forEach(function(nombre) {
    const u = data.usuarios[nombre];
    u.costoEstimado = (u.inputTokens / 1000000) * costoInput + (u.outputTokens / 1000000) * costoOutput;
    u.latenciaPromedioMs = u.peticiones ? Math.round(u.latenciaMs / u.peticiones) : 0;
  });
  return respuesta({ok:true, consumo:data, preciosConfigurados: !!(costoInput || costoOutput)});
}

function configurarCostosAdmin(token, inputPorMillon, outputPorMillon) {
  if (!validarAdmin(token)) return respuestaError("FORBIDDEN", "No tienes permiso.", "Se requiere una sesión administrativa.");
  const props = PropertiesService.getScriptProperties();
  props.setProperty("VERA_COSTO_INPUT_POR_MILLON", String(Math.max(0, Number(inputPorMillon) || 0)));
  props.setProperty("VERA_COSTO_OUTPUT_POR_MILLON", String(Math.max(0, Number(outputPorMillon) || 0)));
  registrarAuditoria("Elion", "CONFIG_COSTOS", "sistema", "Se actualizaron las tarifas configurables de estimación.");
  return respuesta({ok:true});
}

'''
          if marker.replace('\\n','\n') in code and 'const PROP_CONSUMO = "VERA_CONSUMO"' not in code:
              code = code.replace(marker.replace('\\n','\n'), usage_code + marker.replace('\\n','\n'), 1)
              changed_code = True

          # Add endpoint cases.
          old = '''      case "health":\n        return obtenerHealth(\n          body.token\n        );'''
          new = '''      case "health":\n        return obtenerHealth(\n          body.token\n        );\n\n\n      case "consumo":\n        return obtenerConsumoAdmin(\n          body.token\n        );\n\n\n      case "configurarCostos":\n        return configurarCostosAdmin(\n          body.token,\n          body.inputPorMillon,\n          body.outputPorMillon\n        );'''
          code, ok = once(code, old, new, 'consumption-endpoint')
          changed_code |= ok

          # Register usage on successful AI output.
          old = '''    registrarLog(\n      sesion.usuario,\n      "CHAT",\n      "Respuesta generada en " +\n      latencia +\n      " ms."\n    );'''
          new = '''    const inputTokensEstimados =\n      estimarTokens(JSON.stringify(contents));\n\n    const outputTokensEstimados =\n      estimarTokens(respuestaIA);\n\n    registrarConsumoIA(\n      sesion.usuario,\n      inputTokensEstimados,\n      outputTokensEstimados,\n      latencia,\n      false\n    );\n\n    registrarLog(\n      sesion.usuario,\n      "CHAT",\n      "Respuesta generada en " +\n      latencia +\n      " ms. Tokens estimados: " +\n      (inputTokensEstimados + outputTokensEstimados)\n    );'''
          code, ok = once(code, old, new, 'usage-success')
          changed_code |= ok

          # Register AI errors in both response branches.
          old = '''      registrarLog(\n        sesion.usuario,\n        "ERROR_IA",\n        "Servicio de IA respondió " +\n        codigo\n      );'''
          new = '''      registrarConsumoIA(\n        sesion.usuario,\n        estimarTokens(JSON.stringify(contents)),\n        0,\n        latencia,\n        true\n      );\n\n      registrarLog(\n        sesion.usuario,\n        "ERROR_IA",\n        "Servicio de IA respondió " +\n        codigo\n      );'''
          code, ok = once(code, old, new, 'usage-http-error')
          changed_code |= ok

          # --- Admin UI: add consumption section.
          tab_marker = '''      <button\n        class="adminTab"\n        onclick="mostrarSeccion('health',this)"\n      >\n        💚 Salud\n      </button>'''
          tab_new = tab_marker + '''\n\n      <button\n        class="adminTab"\n        onclick="mostrarSeccion('consumo',this)"\n      >\n        🧮 Consumo\n      </button>'''
          index, ok = once(index, tab_marker, tab_new, 'consumption-tab')
          changed_index |= ok

          section_marker = '''      <!-- CONFIG -->'''
          section_new = r'''      <!-- CONSUMO -->

      <section id="section-consumo" class="adminSection">

        <h2 class="sectionTitle">Consumo de Vera</h2>

        <p class="sectionDescription">
          Tokens estimados, peticiones, errores y latencia. El costo es orientativo y depende de las tarifas que configures.
        </p>

        <div id="consumptionGrid" class="statsGrid">
          Cargando...
        </div>

        <div class="adminCard">
          <div class="cardHeader">
            <h3>Consumo por usuario</h3>
            <button class="smallBtn" onclick="cargarConsumo()">↻ Actualizar</button>
          </div>
          <div id="consumptionTable">Cargando...</div>
        </div>

        <div class="adminCard">
          <h3>Tarifas configurables</h3>
          <p class="sectionDescription">Introduce el costo por millón de tokens de entrada y salida según el proveedor que estés usando. Un valor 0 desactiva la estimación de costos.</p>
          <input id="costInputRate" class="configInput" type="number" step="0.000001" min="0" placeholder="Entrada: costo por 1M tokens">
          <input id="costOutputRate" class="configInput" type="number" step="0.000001" min="0" placeholder="Salida: costo por 1M tokens">
          <button class="primaryBtn" onclick="guardarCostos()">Guardar tarifas</button>
        </div>

      </section>

      <!-- CONFIG -->'''
          index, ok = once(index, section_marker, section_new, 'consumption-section')
          changed_index |= ok

          # Add admin JS before UTILIDADES.
          js_marker = '''/* ==================================================\n   UTILIDADES\n================================================== */'''.replace('\\n','\n')
          js_code = r'''/* ==================================================
   CONSUMO
================================================== */

async function cargarConsumo(){
  const grid = document.getElementById("consumptionGrid");
  const table = document.getElementById("consumptionTable");
  try{
    const data = await api({accion:"consumo", token:token});
    if(data.error){
      grid.innerHTML = `<div class="empty">${escapeHTML(data.mensaje || data.error)}</div>`;
      return;
    }
    const c = data.consumo || {};
    const t = c.total || {};
    grid.innerHTML = `
      <div class="statCard"><div class="statNumber">${t.peticiones ?? 0}</div><div class="statLabel">Peticiones</div></div>
      <div class="statCard"><div class="statNumber">${t.tokens ?? 0}</div><div class="statLabel">Tokens estimados</div></div>
      <div class="statCard"><div class="statNumber">${t.errores ?? 0}</div><div class="statLabel">Errores IA</div></div>
      <div class="statCard"><div class="statNumber">${t.peticiones ? Math.round((t.latenciaMs || 0) / t.peticiones) : 0} ms</div><div class="statLabel">Latencia promedio</div></div>
      <div class="statCard"><div class="statNumber">${data.preciosConfigurados ? Number(t.costoEstimado || 0).toFixed(6) : "—"}</div><div class="statLabel">Costo estimado</div></div>
    `;
    const users = Object.entries(c.usuarios || {}).sort((a,b)=>(b[1].tokens||0)-(a[1].tokens||0));
    if(!users.length){
      table.innerHTML = `<div class="empty">Todavía no hay consumo registrado.</div>`;
      return;
    }
    table.innerHTML = `<div class="tableWrap"><table><thead><tr><th>Usuario</th><th>Peticiones</th><th>Entrada</th><th>Salida</th><th>Total</th><th>Latencia</th><th>Errores</th><th>Costo</th></tr></thead><tbody>` +
      users.map(([nombre,u])=>`<tr><td><strong>${escapeHTML(nombre)}</strong></td><td>${u.peticiones||0}</td><td>${u.inputTokens||0}</td><td>${u.outputTokens||0}</td><td>${u.tokens||0}</td><td>${u.latenciaPromedioMs||0} ms</td><td>${u.errores||0}</td><td>${data.preciosConfigurados ? Number(u.costoEstimado||0).toFixed(6) : "—"}</td></tr>`).join("") +
      `</tbody></table></div>`;
  }catch(error){
    console.error(error);
    grid.innerHTML = `<div class="empty">No se pudo cargar el consumo.</div>`;
  }
}

async function guardarCostos(){
  const inputPorMillon = Number(document.getElementById("costInputRate").value || 0);
  const outputPorMillon = Number(document.getElementById("costOutputRate").value || 0);
  const data = await api({accion:"configurarCostos", token:token, inputPorMillon, outputPorMillon});
  if(data.error){ alert(data.mensaje || data.error); return; }
  alert("Tarifas guardadas correctamente.");
  cargarConsumo();
}

'''
          index, ok = once(index, js_marker, js_code + js_marker, 'consumption-js')
          changed_index |= ok

          # Loader switch.
          old = '  if(nombre==="health") cargarHealth();'
          new = '  if(nombre==="health") cargarHealth();\n  if(nombre==="consumo") cargarConsumo();'
          index, ok = once(index, old, new, 'consumption-loader')
          changed_index |= ok

          # Initial admin loader.
          old = '  cargarHealth();\n  cargarConfiguracion();'
          new = '  cargarHealth();\n  cargarConsumo();\n  cargarConfiguracion();'
          index, ok = once(index, old, new, 'consumption-admin-load')
          changed_index |= ok

          if changed_index:
              Path('index.html').write_text(index, encoding='utf-8')
          if changed_code:
              Path('code.gs').write_text(code, encoding='utf-8')
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          Path('/tmp/index-script.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/index-script.js
          node --check code.gs

      - name: Commit
        shell: bash
        run: |
          git config user.name "Vera Upgrade Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html code.gs
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "feat: complete Vera reliability, admin and usage upgrade"
            git push
          fi

      - name: Remove upgrade workflow
        shell: bash
        run: |
          git rm .github/workflows/complete-vera-upgrade.yml
          git commit -m "chore: remove one-shot Vera upgrade workflow"
          git push
