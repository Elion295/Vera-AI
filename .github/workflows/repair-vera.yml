name: Repair Vera

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply reliability fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          code = Path('code.gs').read_text(encoding='utf-8')
          changed = False

          old = 'historial:historial\n\n    });'
          new = 'historial:historial.slice(0,-1)\n\n    });'
          if 'historial:historial.slice(0,-1)' not in index and old in index:
              index = index.replace(old, new, 1)
              changed = True

          old = '''    if(data.error){\n\n      agregarMensaje(\n        "assistant",\n        data.mensaje ||\n        data.error\n      );\n\n      return;\n\n    }'''
          new = '''    if(data.error){\n\n      const detalle =\n        data.razon\n          ? "\\n\\n" + data.razon\n          : "";\n\n      agregarMensaje(\n        "assistant",\n        (data.mensaje || data.error) + detalle\n      );\n\n      return;\n\n    }'''
          if 'const detalle =' not in index and old in index:
              index = index.replace(old, new, 1)
              changed = True

          old = '''  }catch(error){\n\n    ocultarTyping();\n\n    agregarMensaje(\n      "assistant",\n      "No pude conectar con Vera."\n    );\n\n  }finally{'''
          new = '''  }catch(error){\n\n    ocultarTyping();\n\n    console.error("Error al enviar mensaje:", error);\n\n    agregarMensaje(\n      "assistant",\n      "No pude conectar con Vera.\\n\\n" +\n      (error && error.message ? error.message : "Error desconocido.")\n    );\n\n  }finally{'''
          if 'Error al enviar mensaje:' not in index and old in index:
              index = index.replace(old, new, 1)
              changed = True

          old = '''  const historial =\n    Array.isArray(\n      body.historial\n    )\n      ? body.historial.slice(-30)\n      : [];'''
          new = '''  let historial =\n    Array.isArray(\n      body.historial\n    )\n      ? body.historial.slice(-30)\n      : [];\n\n\n  /* Evita duplicar el mensaje actual si el cliente\n     ya lo incluyó dentro del historial. */\n  const ultimo =\n    historial.length\n      ? historial[historial.length - 1]\n      : null;\n\n\n  if (\n    ultimo &&\n    ultimo.rol === "user" &&\n    String(ultimo.texto || "").trim() === mensaje\n  ) {\n\n    historial = historial.slice(0, -1);\n\n  }'''
          if 'Evita duplicar el mensaje actual' not in code and old in code:
              code = code.replace(old, new, 1)
              changed = True

          if changed:
              Path('index.html').write_text(index, encoding='utf-8')
              Path('code.gs').write_text(code, encoding='utf-8')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Vera Repair Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html code.gs
          if git diff --cached --quiet; then
            echo "No fixes needed."
            exit 0
          fi
          git commit -m "fix: stabilize Vera chat history and error details"
          git push

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/repair-vera.yml
          git commit -m "chore: remove one-shot repair workflow"
          git push
